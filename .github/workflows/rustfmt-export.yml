name: rustfmt-export

on:
  push:
    paths:
      - ".github/workflows/rustfmt-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Generate rustfmt patch
        run: |
          cargo fmt --all
          git diff --binary -- '*.rs' > rustfmt.patch
          test -s rustfmt.patch
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
